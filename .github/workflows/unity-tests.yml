name: Unity Tests

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        unity-version: ['6000.1.11f1']
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: Cache Unity Library
      uses: actions/cache@v4
      with:
        path: Library
        key: Library-${{ matrix.unity-version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
        restore-keys: |
          Library-${{ matrix.unity-version }}-
          Library-
          
    - name: Run EditMode Tests
      uses: game-ci/unity-test-runner@v4
      id: editmode-tests
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      with:
        unityVersion: ${{ matrix.unity-version }}
        testMode: EditMode
        artifactsPath: editmode-test-results
        githubToken: ${{ secrets.GITHUB_TOKEN }}
        checkName: EditMode Test Results
        coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+SpaceColonyRPG.*'
        
    - name: Run PlayMode Tests
      uses: game-ci/unity-test-runner@v4
      id: playmode-tests
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      with:
        unityVersion: ${{ matrix.unity-version }}
        testMode: PlayMode
        artifactsPath: playmode-test-results
        githubToken: ${{ secrets.GITHUB_TOKEN }}
        checkName: PlayMode Test Results
        coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+SpaceColonyRPG.*'
        
    - name: Upload EditMode Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: EditMode Test Results
        path: editmode-test-results
        retention-days: 7
        
    - name: Upload PlayMode Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: PlayMode Test Results
        path: playmode-test-results
        retention-days: 7
        
    - name: Upload Coverage Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Coverage Report
        path: CodeCoverage
        retention-days: 7

  build-test:
    name: Test Build
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        unity-version: ['6000.1.11f1']
        targetPlatform: [StandaloneWindows64]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: Cache Unity Library
      uses: actions/cache@v4
      with:
        path: Library
        key: Library-build-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
        restore-keys: |
          Library-build-${{ matrix.targetPlatform }}-
          Library-build-
          Library-
          
    - name: Build project
      uses: game-ci/unity-builder@v4
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      with:
        unityVersion: ${{ matrix.unity-version }}
        targetPlatform: ${{ matrix.targetPlatform }}
        buildName: SpaceColonyRPG
        buildPath: build/${{ matrix.targetPlatform }}
        
    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Build-${{ matrix.targetPlatform }}
        path: build/${{ matrix.targetPlatform }}
        retention-days: 7

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, build-test]
    if: always()
    
    steps:
    - name: Check Results
      run: |
        if [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.build-test.result }}" == "failure" ]; then
          echo "Some checks failed!"
          exit 1
        else
          echo "All checks passed!"
        fi
