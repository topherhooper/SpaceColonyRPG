name: Unity Tests

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        unity-version: ['6000.1.11f1']
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: Cache Unity Library
      uses: actions/cache@v3
      with:
        path: Library
        key: Library-${{ matrix.unity-version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
        restore-keys: |
          Library-${{ matrix.unity-version }}-
          Library-
          
    - name: Run EditMode Tests
      uses: game-ci/unity-test-runner@v4
      id: editmode-tests
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      with:
        unityVersion: ${{ matrix.unity-version }}
        testMode: EditMode
        artifactsPath: editmode-test-results
        githubToken: ${{ secrets.GITHUB_TOKEN }}
        checkName: EditMode Test Results
        coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+SpaceColonyRPG.*'
        
    - name: Run PlayMode Tests
      uses: game-ci/unity-test-runner@v4
      id: playmode-tests
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      with:
        unityVersion: ${{ matrix.unity-version }}
        testMode: PlayMode
        artifactsPath: playmode-test-results
        githubToken: ${{ secrets.GITHUB_TOKEN }}
        checkName: PlayMode Test Results
        coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+SpaceColonyRPG.*'
        
    - name: Upload EditMode Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: EditMode Test Results
        path: editmode-test-results
        retention-days: 7
        
    - name: Upload PlayMode Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: PlayMode Test Results
        path: playmode-test-results
        retention-days: 7
        
    - name: Upload Coverage Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: Coverage Report
        path: CodeCoverage
        retention-days: 7

  build-test:
    name: Test Build
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        unity-version: ['6000.1.11f1']
        targetPlatform: [StandaloneWindows64]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: Cache Unity Library
      uses: actions/cache@v3
      with:
        path: Library
        key: Library-build-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
        restore-keys: |
          Library-build-${{ matrix.targetPlatform }}-
          Library-build-
          Library-
          
    - name: Build project
      uses: game-ci/unity-builder@v4
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      with:
        unityVersion: ${{ matrix.unity-version }}
        targetPlatform: ${{ matrix.targetPlatform }}
        buildName: SpaceColonyRPG
        buildPath: build/${{ matrix.targetPlatform }}
        
    - name: Upload Build
      uses: actions/upload-artifact@v3
      with:
        name: Build-${{ matrix.targetPlatform }}
        path: build/${{ matrix.targetPlatform }}
        retention-days: 7

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'
        
    - name: Run Code Linter
      run: |
        echo "Running code quality checks..."
        # Note: In a real scenario, you'd run the Unity linter here
        # For now, we'll use basic C# analysis
        find Assets/_Project/Scripts -name "*.cs" -type f | while read file; do
          echo "Checking $file"
          # Check for tabs
          if grep -q $'\t' "$file"; then
            echo "Warning: $file contains tabs"
          fi
          # Check for trailing whitespace
          if grep -q '[[:space:]]$' "$file"; then
            echo "Warning: $file has trailing whitespace"
          fi
        done
        
    - name: Check File Naming
      run: |
        echo "Checking file naming conventions..."
        find Assets/_Project/Scripts -name "*.cs" -type f | while read file; do
          filename=$(basename "$file")
          # Check if filename starts with lowercase
          if [[ "$filename" =~ ^[a-z] ]]; then
            echo "Warning: $file should start with uppercase"
          fi
        done

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, build-test, code-quality]
    if: always()
    
    steps:
    - name: Check Results
      run: |
        if [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.build-test.result }}" == "failure" ] || [ "${{ needs.code-quality.result }}" == "failure" ]; then
          echo "Some checks failed!"
          exit 1
        else
          echo "All checks passed!"
        fi