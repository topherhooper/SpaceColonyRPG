name: Code Quality

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  performance-check:
    name: Performance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check for Performance Issues
      run: |
        echo "=== Checking for Unity performance issues ==="
        
        # Check for GameObject.Find and FindObjectOfType usage
        PERF_ISSUES=$(grep -r -n -E "(GameObject\.Find|FindObjectOfType)" Assets/_Project/Scripts --include="*.cs" | grep -v "// PERF:" || true)
        
        if [ -n "$PERF_ISSUES" ]; then
          echo "::warning::Performance warnings found:"
          echo "$PERF_ISSUES"
          echo ""
          echo "Consider adding '// PERF: [justification]' if these are intentional."
          echo "These are warnings only - not blocking the build."
        else
          echo "::notice::No performance issues found!"
        fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check for Sensitive Data
      run: |
        echo "=== Scanning for sensitive data ==="
        
        # Check for potential API keys, passwords, etc.
        patterns=(
          "password.*=.*['\"].*['\"]"
          "api[_-]?key.*=.*['\"].*['\"]"
          "secret.*=.*['\"].*['\"]"
          "token.*=.*['\"].*['\"]"
          "private[_-]?key"
        )
        
        found_issues=false
        
        for pattern in "${patterns[@]}"; do
          echo "Checking for pattern: $pattern"
          if grep -r -i -E "$pattern" Assets/_Project/Scripts --include="*.cs" 2>/dev/null; then
            echo "::error::Found potential sensitive data matching pattern: $pattern"
            found_issues=true
          fi
        done
        
        if [ "$found_issues" = true ]; then
          echo "::error::Security scan failed! Found potential sensitive data in code."
          exit 1
        else
          echo "::notice::Security scan passed!"
        fi

  code-style-optional:
    name: Code Style Check (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check Code Style
      run: |
        echo "=== Running optional code style checks ==="
        echo "Note: These checks are informational only and won't fail the build"
        
        # Create report file
        echo "# Code Style Report (Informational)" > code-style-report.md
        echo "" >> code-style-report.md
        echo "Generated at: $(date)" >> code-style-report.md
        echo "" >> code-style-report.md
        echo "**Note: These are suggestions only. The build will not fail due to style issues.**" >> code-style-report.md
        echo "" >> code-style-report.md
        
        # Initialize counters
        total_files=0
        files_with_suggestions=0
        total_suggestions=0
        
        # Check project C# files (not Mirror)
        while IFS= read -r -d '' file; do
          ((total_files++))
          file_has_suggestions=false
          file_suggestions=""
          
          # Check for lines over 120 characters (suggestion only)
          long_lines=$(awk 'length > 120 {print NR}' "$file" | head -3 | tr '\n' ', ' | sed 's/,$//')
          if [ -n "$long_lines" ]; then
            file_has_suggestions=true
            ((total_suggestions++))
            file_suggestions+="\n  - Consider shortening lines over 120 chars (lines: $long_lines)"
          fi
          
          # Check file naming (suggestion only)
          filename=$(basename "$file")
          if [[ "$filename" =~ ^[a-z] ]] && [[ "$filename" != "packages.config" ]]; then
            file_has_suggestions=true
            ((total_suggestions++))
            file_suggestions+="\n  - Consider using PascalCase for filename"
          fi
          
          if [ "$file_has_suggestions" = true ]; then
            ((files_with_suggestions++))
            echo "" >> code-style-report.md
            echo "### $file" >> code-style-report.md
            echo -e "$file_suggestions" >> code-style-report.md
          fi
          
        done < <(find Assets/_Project/Scripts -name "*.cs" -type f -print0)
        
        # Generate summary
        echo "" >> code-style-report.md
        echo "---" >> code-style-report.md
        echo "## Summary" >> code-style-report.md
        echo "- Total files checked: $total_files" >> code-style-report.md
        echo "- Files with style suggestions: $files_with_suggestions" >> code-style-report.md
        echo "- Total suggestions: $total_suggestions" >> code-style-report.md
        
        # Display report
        cat code-style-report.md
        
        echo ""
        echo "::notice::Code style check complete (informational only)"
        
    - name: Upload Style Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: code-style-report
        path: code-style-report.md
        retention-days: 7